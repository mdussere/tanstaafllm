<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" shape-rendering="crispEdges">
  <!-- The flag of Free Luna, drawn for TANSTAAFLLM from the novel's description:
       "black field speckled with stars, bar sinister in blood, a proud and jaunty
       brass cannon over all, and below it our motto: TANSTAAFL!" (Heinlein, 1966).
       Our own pixel drawing; no third-party artwork. -->
  <title>Flag of Free Luna (after Heinlein)</title>
  <rect width="900" height="600" fill="#05060f"/>
  <!-- stars -->
  <g fill="#eef3ff">
    <rect x="60" y="50" width="6" height="6"/><rect x="150" y="120" width="4" height="4"/><rect x="240" y="40" width="6" height="6"/>
    <rect x="330" y="95" width="4" height="4"/><rect x="420" y="30" width="4" height="4"/><rect x="520" y="70" width="6" height="6"/>
    <rect x="610" y="140" width="4" height="4"/><rect x="700" y="60" width="4" height="4"/><rect x="820" y="110" width="6" height="6"/>
    <rect x="90" y="220" width="4" height="4"/><rect x="40" y="380" width="6" height="6"/><rect x="120" y="520" width="4" height="4"/>
    <rect x="250" y="560" width="6" height="6"/><rect x="380" y="545" width="4" height="4"/><rect x="560" y="565" width="4" height="4"/>
    <rect x="690" y="530" width="6" height="6"/><rect x="840" y="470" width="4" height="4"/><rect x="860" y="300" width="6" height="6"/>
    <rect x="780" y="230" width="4" height="4"/><rect x="200" y="300" width="4" height="4"/><rect x="740" y="400" width="4" height="4"/>
  </g>
  <g fill="#ffb43c"><rect x="470" y="150" width="6" height="6"/><rect x="180" y="440" width="6" height="6"/><rect x="640" y="20" width="6" height="6"/></g>
  <!-- bar sinister in blood: a diagonal band from the upper right to the lower left (as seen) -->
  <polygon points="790,0 900,0 900,40 110,600 0,600 0,560" fill="#b3122e"/>
  <!-- brass cannon over all -->
  <g transform="translate(450,300) rotate(-12)">
    <!-- carriage -->
    <rect x="-120" y="40" width="200" height="34" fill="#7a4a12"/>
    <rect x="-120" y="40" width="200" height="8" fill="#9c6420"/>
    <!-- wheels -->
    <circle cx="-80" cy="82" r="38" fill="#3a2408"/><circle cx="-80" cy="82" r="30" fill="#c8892a"/><circle cx="-80" cy="82" r="10" fill="#3a2408"/>
    <circle cx="50" cy="82" r="38" fill="#3a2408"/><circle cx="50" cy="82" r="30" fill="#c8892a"/><circle cx="50" cy="82" r="10" fill="#3a2408"/>
    <!-- barrel -->
    <polygon points="-170,-10 150,-34 160,-34 160,30 150,30 -170,22" fill="#d9a441"/>
    <polygon points="-170,-10 150,-34 160,-34 160,-22 -170,0" fill="#ffd27a"/>
    <rect x="150" y="-42" width="26" height="80" fill="#b98228"/>
    <rect x="-40" y="-26" width="16" height="56" fill="#b98228"/>
    <circle cx="-180" cy="6" r="22" fill="#b98228"/><circle cx="-200" cy="6" r="10" fill="#d9a441"/>
  </g>
  <!-- motto -->
  <text x="450" y="545" text-anchor="middle" font-family="'Press Start 2P', 'Courier New', monospace" font-weight="bold" font-size="64" fill="#ffd27a" stroke="#05060f" stroke-width="6" paint-order="stroke" letter-spacing="6">TANSTAAFL!</text>
</svg>
