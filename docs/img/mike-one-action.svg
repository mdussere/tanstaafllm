<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="DejaVu Sans, Verdana, sans-serif">
  <title>Mike: one request, one action</title>
  <defs>
    <pattern id="stars" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="#0b1026"/>
      <rect x="13" y="21" width="2" height="2" fill="#9fb3c8"/>
      <rect x="71" y="9" width="2" height="2" fill="#6f7fa8"/>
      <rect x="98" y="63" width="2" height="2" fill="#9fb3c8"/>
    </pattern>
    <marker id="aV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a98cf5"/></marker>
  </defs>
  <style>
    .title { font: bold 26px 'DejaVu Sans Mono', monospace; fill: #e6ecf5; letter-spacing: 2px; }
    .sub { font: 13px 'DejaVu Sans Mono', monospace; fill: #9fb3c8; }
    .h { font: bold 14px 'DejaVu Sans Mono', monospace; fill: #ffb347; }
    .t { font: 12.5px 'DejaVu Sans', sans-serif; fill: #d5deec; }
    .s { font: 11.5px 'DejaVu Sans', sans-serif; fill: #9fb3c8; }
    .tool { font: bold 12px 'DejaVu Sans Mono', monospace; fill: #e6ecf5; }
    .lab { font: bold 11.5px 'DejaVu Sans Mono', monospace; fill: #a98cf5; }
    .box { fill: #141b3d; stroke: #3b4a7a; stroke-width: 3; }
  </style>
  <rect width="960" height="500" fill="url(#stars)"/>
  <text x="30" y="46" class="title">MIKE · ONE REQUEST, ONE ACTION</text>
  <text x="30" y="68" class="sub">a small local model that may only choose from a short list</text>

  <g shape-rendering="crispEdges">
    <rect x="30" y="96" width="170" height="86" fill="#22182e" stroke="#ff7b39" stroke-width="3"/>
    <rect x="250" y="96" width="190" height="86" class="box"/>
    <rect x="490" y="96" width="200" height="86" fill="#1b1446" stroke="#7a5cd6" stroke-width="3"/>
    <rect x="740" y="96" width="190" height="86" class="box"/>
  </g>
  <text x="44" y="120" class="h">REQUEST</text>
  <text x="44" y="140" class="t">"ouvre la</text>
  <text x="44" y="157" class="t">calculatrice"</text>
  <text x="264" y="120" class="h">KEYWORD TABLE</text>
  <text x="264" y="140" class="t">obvious requests are</text>
  <text x="264" y="157" class="t">matched with no model</text>
  <text x="504" y="120" class="h">LFM2.5-350M</text>
  <text x="504" y="140" class="t">otherwise, the model</text>
  <text x="504" y="157" class="t">picks one tool call</text>
  <text x="754" y="120" class="h">YOU ACCEPT</text>
  <text x="754" y="140" class="t">then Wyoh's MCP runs</text>
  <text x="754" y="157" class="t">it, or nothing happens</text>
  <g fill="none" stroke="#a98cf5" stroke-width="3">
    <path d="M200 139 H248" marker-end="url(#aV)"/>
    <path d="M440 139 H488" marker-end="url(#aV)"/>
    <path d="M690 139 H738" marker-end="url(#aV)"/>
  </g>
  <text x="464" y="90" class="lab" text-anchor="middle">no match ↓</text>

  <text x="30" y="244" class="h">THE ONLY THINGS MIKE CAN ASK FOR</text>
  <g shape-rendering="crispEdges">
    <rect x="30" y="258" width="130" height="30" fill="#0f2a33" stroke="#3ee6e0" stroke-width="2"/>
    <rect x="168" y="258" width="140" height="30" fill="#0f2a33" stroke="#3ee6e0" stroke-width="2"/>
    <rect x="316" y="258" width="124" height="30" fill="#0f2a33" stroke="#3ee6e0" stroke-width="2"/>
    <rect x="448" y="258" width="140" height="30" fill="#0f2a33" stroke="#3ee6e0" stroke-width="2"/>
    <rect x="596" y="258" width="130" height="30" fill="#0f2a33" stroke="#3ee6e0" stroke-width="2"/>
    <rect x="734" y="258" width="110" height="30" fill="#0f2a33" stroke="#3ee6e0" stroke-width="2"/>
    <rect x="852" y="258" width="78" height="30" fill="#1a1f33" stroke="#6f7fa8" stroke-width="2"/>
  </g>
  <text x="95" y="278" class="tool" text-anchor="middle">list_windows</text>
  <text x="238" y="278" class="tool" text-anchor="middle">focus_window</text>
  <text x="378" y="278" class="tool" text-anchor="middle">launch_app</text>
  <text x="518" y="278" class="tool" text-anchor="middle">close_window</text>
  <text x="661" y="278" class="tool" text-anchor="middle">move_window</text>
  <text x="789" y="278" class="tool" text-anchor="middle">type_text</text>
  <text x="891" y="278" class="tool" text-anchor="middle">none</text>
  <text x="30" y="312" class="s">Apps come from an allowlist; no raw Sway command and no free shell are ever exposed to the model. "none" lets it say why it cannot help.</text>

  <text x="30" y="356" class="h">HOW GOOD IS IT? 31 NEW REQUESTS IT HAD NEVER SEEN</text>
  <g shape-rendering="crispEdges">
    <rect x="260" y="370" width="279" height="22" fill="#6f7fa8"/>
    <rect x="260" y="398" width="319" height="22" fill="#a98cf5"/>
    <rect x="260" y="426" width="399" height="22" fill="#ffb347"/>
    <rect x="260" y="370" width="620" height="78" fill="none" stroke="#3b4a7a" stroke-width="2"/>
  </g>
  <text x="30" y="386" class="t">keyword table alone</text>
  <text x="30" y="414" class="t">model + adapter</text>
  <text x="30" y="442" class="t">keyword table, then model</text>
  <text x="547" y="386" class="s">14 / 31</text>
  <text x="587" y="414" class="s">16 / 31</text>
  <text x="667" y="442" class="s">20 / 31</text>
  <text x="30" y="482" class="s">Desk host (x86) measurements: about 0.2 s per request with a cached prompt, ≈ 300 MiB lean. Not yet run on Luna. Source: Mike 0304_01.</text>
</svg>
