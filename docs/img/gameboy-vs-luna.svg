<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="DejaVu Sans, Verdana, sans-serif">
  <title>Game Boy against Luna</title>
  <defs>
    <pattern id="stars" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="#0b1026"/>
      <rect x="13" y="21" width="2" height="2" fill="#9fb3c8"/>
      <rect x="71" y="9" width="2" height="2" fill="#6f7fa8"/>
      <rect x="98" y="63" width="2" height="2" fill="#9fb3c8"/>
    </pattern>
  </defs>
  <style>
    .title { font: bold 26px 'DejaVu Sans Mono', monospace; fill: #e6ecf5; letter-spacing: 2px; }
    .sub { font: 13px 'DejaVu Sans Mono', monospace; fill: #9fb3c8; }
    .h { font: bold 14px 'DejaVu Sans Mono', monospace; fill: #ffb347; }
    .t { font: 12.5px 'DejaVu Sans', sans-serif; fill: #d5deec; }
    .s { font: 11px 'DejaVu Sans', sans-serif; fill: #9fb3c8; }
    .big { font: bold 18px 'DejaVu Sans Mono', monospace; fill: #3ee6e0; }
    .gb { font: bold 11px 'DejaVu Sans Mono', monospace; fill: #0b1026; }
    .axis { font: 11px 'DejaVu Sans Mono', monospace; fill: #6f7fa8; }
  </style>
  <rect width="960" height="420" fill="url(#stars)"/>
  <text x="30" y="46" class="title">GAME BOY AGAINST LUNA</text>
  <text x="30" y="68" class="sub">how many times more Luna has · logarithmic scale, each step is ×10</text>

  <!-- log axis: x = 260 + 100 px per decade -->
  <g stroke="#1d2a4f" stroke-width="1">
    <line x1="260" y1="90" x2="260" y2="330"/><line x1="360" y1="90" x2="360" y2="330"/>
    <line x1="460" y1="90" x2="460" y2="330"/><line x1="560" y1="90" x2="560" y2="330"/>
    <line x1="660" y1="90" x2="660" y2="330"/><line x1="760" y1="90" x2="760" y2="330"/>
  </g>
  <text x="260" y="346" class="axis" text-anchor="middle">×1</text>
  <text x="360" y="346" class="axis" text-anchor="middle">×10</text>
  <text x="460" y="346" class="axis" text-anchor="middle">×100</text>
  <text x="560" y="346" class="axis" text-anchor="middle">×1,000</text>
  <text x="660" y="346" class="axis" text-anchor="middle">×10,000</text>
  <text x="760" y="346" class="axis" text-anchor="middle">×100,000</text>

  <text x="30" y="118" class="h">MODEL SPEED</text>
  <text x="30" y="136" class="s">weights read per second</text>
  <rect x="256" y="104" width="8" height="30" fill="#9bbc0f"/>
  <rect x="264" y="104" width="474" height="30" fill="#3ee6e0" opacity="0.85"/>
  <text x="748" y="126" class="big">×60,000</text>
  <text x="270" y="152" class="s">Game Boy ≈ 30 k parameter-tokens/s · Luna ≈ 1.9 billion</text>

  <text x="30" y="198" class="h">WORKING MEMORY</text>
  <text x="30" y="216" class="s">for the model</text>
  <rect x="256" y="184" width="8" height="30" fill="#9bbc0f"/>
  <rect x="264" y="184" width="356" height="30" fill="#3ee6e0" opacity="0.85"/>
  <text x="630" y="206" class="big">×4,000</text>
  <text x="270" y="232" class="s">Game Boy 8 KiB + up to 128 KiB on the cartridge · Luna ≈ 450–550 MiB left beside the desktop</text>

  <text x="30" y="278" class="h">MODEL SIZE</text>
  <text x="30" y="296" class="s">parameters</text>
  <rect x="256" y="264" width="8" height="30" fill="#9bbc0f"/>
  <rect x="264" y="264" width="337" height="30" fill="#3ee6e0" opacity="0.85"/>
  <text x="611" y="286" class="big">×2,500</text>
  <text x="270" y="312" class="s">Chat-GBC 62–136 k · Luna runs LFM2.5-350M</text>

  <rect x="30" y="368" width="14" height="10" fill="#9bbc0f"/><text x="50" y="378" class="t">Game Boy (1989), Rudy's Chat-GBC</text>
  <rect x="330" y="368" width="14" height="10" fill="#3ee6e0"/><text x="350" y="378" class="t">Luna, the R36 Ultra</text>
  <text x="30" y="404" class="s">Game Boy figures from Chat-GBC's ARCHITECTURE.md; Luna from worklines/mike/docs/0801_01 and 0405_01. Table in 1007_01.</text>
</svg>
