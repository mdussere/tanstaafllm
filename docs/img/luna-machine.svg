<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="DejaVu Sans, Verdana, sans-serif">
  <title>Luna, the whole machine</title>
  <defs>
    <pattern id="stars" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="#0b1026"/>
      <rect x="13" y="21" width="2" height="2" fill="#9fb3c8"/>
      <rect x="71" y="9" width="2" height="2" fill="#6f7fa8"/>
      <rect x="98" y="63" width="2" height="2" fill="#9fb3c8"/>
      <rect x="42" y="88" width="2" height="2" fill="#6f7fa8"/>
      <rect x="5" y="110" width="2" height="2" fill="#3b4a7a"/>
    </pattern>
  </defs>
  <style>
    .title { font: bold 26px 'DejaVu Sans Mono', monospace; fill: #e6ecf5; letter-spacing: 2px; }
    .sub { font: 13px 'DejaVu Sans Mono', monospace; fill: #9fb3c8; }
    .h { font: bold 15px 'DejaVu Sans Mono', monospace; fill: #ffb347; letter-spacing: 1px; }
    .t { font: 13px 'DejaVu Sans', sans-serif; fill: #d5deec; }
    .s { font: 11.5px 'DejaVu Sans', sans-serif; fill: #9fb3c8; }
    .chip { font: bold 12.5px 'DejaVu Sans Mono', monospace; fill: #e6ecf5; }
    .frame { fill: #141b3d; stroke: #3b4a7a; stroke-width: 3; }
    .hot { fill: #1b1446; stroke: #7a5cd6; stroke-width: 3; }
  </style>
  <rect width="960" height="640" fill="url(#stars)"/>
  <!-- the moon -->
  <circle cx="905" cy="40" r="70" fill="#2a3557" opacity="0.6"/>
  <circle cx="885" cy="25" r="10" fill="#1f2846" opacity="0.7"/>

  <text x="30" y="46" class="title">LUNA · THE WHOLE MACHINE</text>
  <text x="30" y="68" class="sub">R36 Ultra handheld · what runs where, 2026-10-25</text>

  <!-- ===== left column: the device, bottom-up ===== -->
  <!-- brains -->
  <rect x="30" y="88" width="300" height="92" class="frame" shape-rendering="crispEdges"/>
  <text x="44" y="112" class="h">MYCROFT · voice → text</text>
  <text x="44" y="134" class="t">Speech recognition (Sherpa-ONNX).</text>
  <text x="44" y="152" class="t">Resident on Luna; dictates into the Slate.</text>
  <rect x="44" y="162" width="9" height="9" fill="#ffb347"/><text x="59" y="171" class="s">microphone: a USB-C headset</text>

  <rect x="350" y="88" width="300" height="92" class="frame" shape-rendering="crispEdges"/>
  <text x="364" y="112" class="h">MIKE · local brain</text>
  <text x="364" y="134" class="t">Small local model (LFM2.5-350M)</text>
  <text x="364" y="152" class="t">picks one desktop action at a time.</text>
  <rect x="364" y="162" width="9" height="9" fill="#ffb347"/><text x="379" y="171" class="s">measured on the desk host only</text>

  <!-- apps -->
  <rect x="30" y="196" width="620" height="84" class="frame" shape-rendering="crispEdges"/>
  <text x="44" y="220" class="h">APPS</text>
  <g shape-rendering="crispEdges">
    <rect x="44" y="232" width="104" height="30" fill="#0f2a33" stroke="#3ee6e0" stroke-width="2"/><text x="96" y="252" class="chip" text-anchor="middle">Calculator</text>
    <rect x="156" y="232" width="84" height="30" fill="#0f2a33" stroke="#3ee6e0" stroke-width="2"/><text x="198" y="252" class="chip" text-anchor="middle">Files</text>
    <rect x="248" y="232" width="138" height="30" fill="#0f2a33" stroke="#3ee6e0" stroke-width="2"/><text x="317" y="252" class="chip" text-anchor="middle">Wolfenstein 3D</text>
    <rect x="394" y="232" width="70" height="30" fill="#1a1f33" stroke="#6f7fa8" stroke-width="2" stroke-dasharray="4 3"/><text x="429" y="252" class="chip" text-anchor="middle">Chess</text>
    <rect x="472" y="232" width="62" height="30" fill="#1a1f33" stroke="#6f7fa8" stroke-width="2" stroke-dasharray="4 3"/><text x="503" y="252" class="chip" text-anchor="middle">Dino</text>
    <rect x="542" y="232" width="94" height="30" fill="#1a1f33" stroke="#6f7fa8" stroke-width="2" stroke-dasharray="4 3"/><text x="589" y="252" class="chip" text-anchor="middle">NetSurf</text>
  </g>

  <!-- wyoh -->
  <rect x="30" y="296" width="620" height="128" class="hot" shape-rendering="crispEdges"/>
  <text x="44" y="320" class="h">WYOH · the desktop that agents and buttons can drive</text>
  <g shape-rendering="crispEdges">
    <rect x="44" y="334" width="120" height="30" fill="#0f2a33" stroke="#3ee6e0" stroke-width="2"/><text x="104" y="354" class="chip" text-anchor="middle">Sway 1.12</text>
    <rect x="172" y="334" width="150" height="30" fill="#0f2a33" stroke="#3ee6e0" stroke-width="2"/><text x="247" y="354" class="chip" text-anchor="middle">gamepad daemon</text>
    <rect x="330" y="334" width="170" height="30" fill="#0f2a33" stroke="#3ee6e0" stroke-width="2"/><text x="415" y="354" class="chip" text-anchor="middle">Slate + keyboard</text>
    <rect x="508" y="334" width="128" height="30" fill="#0f2a33" stroke="#3ee6e0" stroke-width="2"/><text x="572" y="354" class="chip" text-anchor="middle">menu (fuzzel)</text>
    <rect x="44" y="374" width="160" height="30" fill="#0f2a33" stroke="#3ee6e0" stroke-width="2"/><text x="124" y="394" class="chip" text-anchor="middle">4-tile layout</text>
    <rect x="212" y="374" width="140" height="30" fill="#0f2a33" stroke="#3ee6e0" stroke-width="2"/><text x="282" y="394" class="chip" text-anchor="middle">status bar</text>
    <rect x="360" y="374" width="276" height="30" fill="#1a1f33" stroke="#ffb347" stroke-width="2"/><text x="498" y="394" class="chip" text-anchor="middle">MCP bridge (development)</text>
  </g>

  <!-- system -->
  <rect x="30" y="440" width="620" height="70" class="frame" shape-rendering="crispEdges"/>
  <text x="44" y="464" class="h">SYSTEM</text>
  <text x="44" y="486" class="t">Arch Linux ARM, on ArchR's boot and kernel 6.12 (since 2026-10-25), systemd.</text>
  <text x="44" y="503" class="t">ARM's Mali driver: OpenCL yes, Vulkan no. Everything of ours lives in /storage/.local.</text>

  <!-- hardware -->
  <rect x="30" y="526" width="620" height="88" fill="#22182e" stroke="#ff7b39" stroke-width="3" shape-rendering="crispEdges"/>
  <text x="44" y="550" class="h">HARDWARE</text>
  <text x="44" y="572" class="t">Rockchip RK3326: 4 × Cortex-A35 · Mali-G31 MP2 GPU · 983 MiB RAM</text>
  <text x="44" y="590" class="t">720 × 720 panel · gamepad (17 buttons, 2 sticks) · Wi-Fi 2.4 GHz</text>
  <text x="44" y="607" class="t">Speaker and headset jack (the jack's microphone gives no signal)</text>

  <!-- ===== right column: the world around Luna ===== -->
  <rect x="690" y="88" width="240" height="132" fill="#1b1446" stroke="#7a5cd6" stroke-width="3" stroke-dasharray="8 4" shape-rendering="crispEdges"/>
  <text x="704" y="112" class="h">MANNIE</text>
  <text x="704" y="134" class="t">Frontier model (Claude),</text>
  <text x="704" y="152" class="t">reached through the Tunnel.</text>
  <text x="704" y="174" class="t">Costly; used deliberately.</text>
  <rect x="704" y="190" width="9" height="9" fill="#ffb347"/><text x="719" y="199" class="s">installed on Luna; moving there</text>

  <rect x="690" y="296" width="240" height="104" class="frame" shape-rendering="crispEdges"/>
  <text x="704" y="320" class="h">DESK HOST</text>
  <text x="704" y="342" class="t">Where the agent cell codes,</text>
  <text x="704" y="360" class="t">tests and deploys. Reaches</text>
  <text x="704" y="378" class="t">Luna over SSH, one session</text>
  <text x="704" y="394" class="t">at a time.</text>

  <rect x="690" y="440" width="240" height="88" class="frame" shape-rendering="crispEdges"/>
  <text x="704" y="464" class="h">LUNA-PI</text>
  <text x="704" y="486" class="t">Raspberry Pi 4 reference</text>
  <text x="704" y="504" class="t">board: same aarch64 code,</text>
  <text x="704" y="520" class="t">faster CPU, first tests.</text>

  <!-- links -->
  <g stroke="#3ee6e0" stroke-width="3" fill="none">
    <path d="M690 348 H660"/>
    <path d="M660 348 l10 -7 v14 z" fill="#3ee6e0"/>
  </g>
  <text x="664" y="333" class="s" text-anchor="end">SSH</text>
  <g stroke="#7a5cd6" stroke-width="3" fill="none" stroke-dasharray="6 4">
    <path d="M690 150 H660"/>
  </g>
  <text x="664" y="140" class="s" text-anchor="end">API</text>

  <!-- legend -->
  <g shape-rendering="crispEdges">
    <rect x="690" y="560" width="14" height="14" fill="#0f2a33" stroke="#3ee6e0" stroke-width="2"/><text x="712" y="572" class="s">live on Luna</text>
    <rect x="690" y="582" width="14" height="14" fill="#1a1f33" stroke="#6f7fa8" stroke-width="2" stroke-dasharray="3 2"/><text x="712" y="594" class="s">planned</text>
    <rect x="690" y="604" width="14" height="14" fill="#ffb347"/><text x="712" y="616" class="s">caveat on the status</text>
  </g>
</svg>
