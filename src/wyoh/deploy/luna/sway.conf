# Wyoh development session on Luna's real 720x720 DSI panel (Steps 4.7-4.8).
# Same bindings as luna-pi (deploy/luna-pi/sway-vnc.conf); ArchR's Sway 1.11.
# There is deliberately no exit binding; stop the unit from SSH instead.

set $mod Mod1
set $term foot
# Application menu with icons (Step 4.8): Debian's fuzzel 1.12, no GTK.
set $menu fuzzel --config /storage/.local/share/tanstfaafllm/wyoh/deploy/luna/fuzzel.ini

xwayland disable
# The USB keyboard is French AZERTY; `--to-code` binds physical keys.
input type:keyboard xkb_layout fr
# The test mouse (uinput) moves 1:1 so a click lands where it is aimed.
input "4617:2:wyoh-uinput-mouse" {
    accel_profile flat
    pointer_accel 0
}
font pango:Liberation Sans 10

output DSI-1 transform 0
output * bg #1f2430 solid_color
seat * hide_cursor 3000
# Click to focus, as in Windows 3.x. With Sway's default focus-follows-mouse,
# moving the pointer over a window steals focus and closes the open menu.
focus_follows_mouse no

default_border pixel 2
client.focused #5294e2 #5294e2 #ffffff #5294e2 #5294e2

### Launch and close
bindsym --to-code $mod+Return exec $term
bindsym --to-code $mod+d exec $menu
bindsym --to-code $mod+Shift+q kill
bindsym --to-code $mod+Shift+c reload
floating_modifier $mod normal

### Focus and move
bindsym --to-code $mod+Left focus left
bindsym --to-code $mod+Down focus down
bindsym --to-code $mod+Up focus up
bindsym --to-code $mod+Right focus right
bindsym --to-code $mod+Shift+Left move left
bindsym --to-code $mod+Shift+Down move down
bindsym --to-code $mod+Shift+Up move up
bindsym --to-code $mod+Shift+Right move right

### Workspaces 1-4
bindsym --to-code $mod+1 workspace number 1
bindsym --to-code $mod+2 workspace number 2
bindsym --to-code $mod+3 workspace number 3
bindsym --to-code $mod+4 workspace number 4
bindsym --to-code $mod+Shift+1 move container to workspace number 1
bindsym --to-code $mod+Shift+2 move container to workspace number 2
bindsym --to-code $mod+Shift+3 move container to workspace number 3
bindsym --to-code $mod+Shift+4 move container to workspace number 4

### Layout
bindsym --to-code $mod+f fullscreen
bindsym --to-code $mod+e layout toggle split
bindsym --to-code $mod+w layout tabbed
bindsym --to-code $mod+Shift+space floating toggle

bar {
    position top
    font pango:Liberation Sans 10
    status_command /storage/.local/share/tanstfaafllm/wyoh/deploy/luna/status.sh
    colors {
        statusline #ffffff
        background #323232
        inactive_workspace #32323200 #32323200 #8c8c8c
    }
}

### Wyoh plumbing
exec /usr/bin/python3 /storage/.local/share/tanstfaafllm/wyoh/deploy/luna/write_session_descriptor.py
