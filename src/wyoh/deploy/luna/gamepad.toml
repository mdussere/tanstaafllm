# Wyoh gamepad daemon on Luna (Step 5). Intent: worklines/wyoh/docs/0500_01.
# Every mapping default lives in wyoh_gamepad.Config; this file holds what is
# specific to the device. Unknown keys are refused at start.

# The real gamepad and the development "person" (MCP virtual gamepad).
devices = ["r36s_Gamepad", "wyoh-virtual-gamepad"]
grab = true

# Start opens the application menu (Alt+d's menu in sway.conf).
menu_command = "fuzzel --config /storage/.local/share/tanstfaafllm/wyoh/deploy/luna/fuzzel.ini"

# The Slate (Step 6): a multi-line editor in a floating foot window, black
# with white text. Its font is half the size of the old fuzzel zone's: that
# zone's capitals were 17 px high (Liberation Sans, about 25 px em), so the
# Slate used a 12 px em, now 14 px (20 % larger, user, 2026-10-13).
# "{socket}" is the daemon's private Slate socket.
zone_command = [
    "foot", "--app-id=wyoh-slate", "--title=Slate", "--window-size-pixels=716x214",
    "-o", "font=Liberation Mono:pixelsize=14", "-o", "pad=6x4", "-o", "resize-by-cells=no",
    "-o", "colors.background=000000", "-o", "colors.foreground=ffffff",
    "-o", "cursor.color=000000 ffffff",
    "/usr/bin/python3", "/storage/.local/share/tanstfaafllm/wyoh/wyoh_slate.py", "--socket", "{socket}",
]

# The on-screen keyboard, shown whenever the Slate is open (user, 2026-10-09):
# wvkbd 0.15 built with Luna's AZERTY letter layer (src/wyoh/wvkbd/), whose
# second layer is wvkbd's digits and symbols. White background and black
# keys: wvkbd's 2 px key inset shows as white outlines. The label font fits
# ten keys across 720 px. Built with luna-cursors.patch: the daemon moves and
# presses two selections through the keyboard's standard input.
keyboard_command = [
    "wvkbd-luna", "-l", "simple,special", "-H", "240",
    # Luna's square panel makes wvkbd pick its landscape mode: same layers and height.
    "--landscape-layers", "simple,special", "-L", "240",
    "--bg", "ffffffff", "--fg", "000000ff", "--fg-sp", "000000ff",
    "--press", "808080ff", "--press-sp", "808080ff",
    "--text", "ffffffff", "--text-sp", "ffffffff",
    "--fn", "Liberation Sans 18",
    # Two-thumb typing (user, 2026-10-09): a pastel green selection (left stick,
    # L3) starting on "f" and a pastel red one (right stick, R3) on "j".
    "--cursors", "--cursor0", "b8e6b8ff", "--cursor1", "f5b5b5ff", "--cursor-text", "1e1e1eff",
    "--home0", "0.35,0.375", "--home1", "0.65,0.375",
]

# While the Slate is open (it always has the focus), the focused border is
# white; Sway has one colour for every focused window, so it is restored after.
zone_open_sway = "client.focused #ffffff #000000 #ffffff #ffffff #ffffff"
zone_close_sway = "client.focused #5294e2 #5294e2 #ffffff #5294e2 #5294e2"
# foot sizes the Slate itself (716 x 214 + the 2 px border = 720 x 218). A Sway
# resize raced with foot's own size and left a smaller surface centred in a
# larger frame; Sway now only positions it, again once it has connected.
zone_ready_sway = '[app_id="wyoh-slate"] move position 0 0'

# Mycroft's dictation (Step 12): L2 in the Slate starts it, L2 again (or any
# key) stops it. Resident Kroko (Step 12.4, Mycroft's 0903_03 reply and
# 1204_01): the provider starts when the Slate first opens, loads the model
# once (24.4 s on Luna, 2 threads; 151.5 MiB idle, 172 MiB while dictating)
# and stays loaded while the Slate is hidden or closed; L2 sends start/stop.
# The final text arrives ~1.2 s after stop, with capitals and punctuation.
# {capture} is chosen when the provider starts: a USB microphone if plugged in
# (the jack gave no signal in the user's test, 2026-10-11), else the RK817.
# The Slate opens hidden when the session starts, so Kroko loads at once
# (user, 2026-10-15: no wait at the first L1 or L2).
zone_preload = true

dictate_command = [
    "/usr/bin/python3", "/storage/.local/share/tanstfaafllm/mycroft/mycroft_dictate.py",
    "--resident", "--model", "kroko-fr-2025",
    "--input", "{capture}", "--assets", "/storage/.local/opt/mycroft", "--threads", "2",
]

# Per-app gamepad profiles (Step 9.3), generated from the apps' manifests by
# `make wyoh-luna-apps` (wyoh_apps.py). Missing file = no profiles.
app_profiles_file = "/storage/.local/share/tanstfaafllm/wyoh/generated/app-profiles.toml"

# Paced delivery into the window that had focus (bemenu-style clients drop
# keys typed faster than they load the keymap).
deliver_command = ["wtype", "-s", "100", "-d", "10", "--"]

[pointer]
dead_zone = 0.12
max_speed = 900.0
gamma = 2.0
# The DSI panel refreshes at about 54.5 Hz; faster pointer updates are wasted.
tick_hz = 60.0
axis_max = 1800.0
