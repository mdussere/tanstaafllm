# Wyoh application menu on Luna (Step 4.8): fuzzel, no GTK.
# Windows 3.x palette: silver menu, navy selection, maroon match highlight.
[main]
font=Liberation Sans:size=12
prompt="Run: "
icon-theme=Papirus
icons-enabled=yes
terminal=foot -e
lines=8
width=28
horizontal-pad=12
vertical-pad=10
inner-pad=6
line-height=28
anchor=center
layer=overlay
# Fixed alphabetical order, like a Program Manager group, and no hidden
# launch history (fuzzel otherwise sorts by launch frequency).
cache=/dev/null

[colors]
background=c0c0c0ff
text=000000ff
prompt=000000ff
input=000000ff
placeholder=606060ff
match=800000ff
selection=000080ff
selection-text=ffffffff
selection-match=ffff00ff
border=000000ff

[border]
width=2
radius=0
