wayland_app_id = "mike"
input = "keys"
window = "tile"  # not fullscreen: Sway would hide the floating Slate behind it (live, 2026-10-31)
gpu = false
quit = "FN+B closes it (Sway kill), or /quit"
icon = "./mike-icon.svg"
categories = ["Utility", "Chat"]
