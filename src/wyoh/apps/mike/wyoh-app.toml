# model and llama-server, in MIKE_HOME (/home/michael/.local/opt/mike).
# Deployed to /storage/.local/opt/wyoh-mike/.
id = "mike"
name = "Mike"
comment = "Talk with Mike, Luna's small local model"
version = "wyoh-6.11"
