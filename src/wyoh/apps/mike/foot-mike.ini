# Mike's window (Wyoh 6.13, look A: "terminal skin"): the series' palette and
# VT323, readable at arm's length on Luna's 720x720 panel. Used by `run`.
[main]
font=VT323:pixelsize=30
pad=20x16
initial-window-size-pixels=720x720

[colors]
background=0b1026
foreground=e8eef6
# regular: black red green yellow(amber) blue magenta cyan white
regular0=0b1026
regular1=e8605a
regular2=5be37d
regular3=f2a93b
regular4=6b5fa8
regular5=b48ee8
regular6=4fd8e8
regular7=c8cfe0
bright0=808cb0
bright3=ffc163
bright6=8fe9f3
bright7=ffffff

[cursor]
color=0b1026 f2a93b
blink=yes
