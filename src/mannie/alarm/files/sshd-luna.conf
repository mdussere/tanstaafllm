# Luna: keep the host keys ArchR generated, on STORAGE, so Luna's SSH fingerprint
# does not change with the new root. Key login only.
HostKey /storage/.cache/ssh/ssh_host_ed25519_key
HostKey /storage/.cache/ssh/ssh_host_ecdsa_key
HostKey /storage/.cache/ssh/ssh_host_rsa_key
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
