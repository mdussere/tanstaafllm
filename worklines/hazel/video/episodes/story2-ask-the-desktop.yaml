     lines: ["Don't build a compositor.", "Ask the one that exists."]}
  - {kind: box, x: 120, y: 430, w: 560, h: 440, edge: green, from: 0.9}
  - {kind: minidesk, x: 150, y: 460, w: 500, h: 240, focus: cycle, from: 0.9}
  - {kind: text, size: 32, color: chrome, x: 150, y: 760, at: 0.9, fade: 0, lines: ["SWAY"]}
  - {kind: text, color: green, x: 150, y: 805, at: 1.3, fade: 0.1, lines: ["UNMODIFIED"]}
  - {kind: text, color: amber, x: 150, y: 845, at: 1.7, fade: 0.1, lines: ["NO FORK"]}
  - {kind: rects, from: 2.2, rects: [[680, 570, 60, 24, "#8e97cc"], [740, 560, 20, 44, "#cfd6ff"]]}
  - {kind: text, color: cyan, x: 690, y: 650, at: 2.2, fade: 0, lines: ["IPC"]}
  - {kind: packet, at: 2.7, dur: 0.3, x0: 760, x1: 780, y: 582, color: cyan}
  - {kind: packet, at: 3.2, dur: 0.3, x0: 760, x1: 780, y: 582, color: cyan}
  - {kind: packet, at: 3.7, dur: 0.3, x0: 760, x1: 780, y: 582, color: cyan}
  - {kind: packet, at: 4.2, dur: 0.3, x0: 760, x1: 780, y: 582, color: cyan}
  - {kind: runs, x: 800, y: 460, size: 28, at: 2.3, fade: 0.1, read: "MEASURED ON luna-pi, A RASPBERRY PI",
     parts: [["MEASURED ON ", amber], ["luna-pi", cyan], [", A RASPBERRY PI", dim]]}
  - {kind: tiles, x: 800, y: 485, badge: luna-pi, read: true,
     tiles: [[3.0, "SOCKET READY", "42 ms"], [3.5, "FOCUS EVENT", "0.6 ms"], [4.0, "SWAY MEMORY", "~20 MiB"], [4.5, "KILLED, BACK IN", "7.5 ms"]]}
  events:
  - {fx: blip, ch: p2, at: 0.9, m: 84, frames: 3, v: 8, duty: 1}
  - {fx: ding, at: 1.3, m: 84}
  - {fx: blip, ch: p2, at: 1.7, m: 79, frames: 3, v: 8, duty: 1}
  - {fx: nz, at: 2.3, v: [9, 6, 3], per: 2}
  - {fx: melody, at: 1.0, notes: motif_head, v: 9}
  - {fx: blip, ch: p1, at: 3.0, step: 0.5, n: 4, each: {m: [76, 79, 81, 84]}, frames: 4, v: 11, duty: 2}
  - {fx: ding, at: 4.5, m: 88}
  - {fx: melody, at: 5.0, notes: [[0, 84, 1], [1, 83, 1]], v: 9}
  picture: 'Stage 3: unmodified Sway, IPC socket, four tiles 42 ms / 0.6 ms / ~20 MiB / 7.5 ms, each labelled luna-pi'
  music_note: 'Bright C G Am F, motif head, four rising blips'
  facts:
  - {on_screen: '"Don''t build a compositor. Ask the one that exists." UNMODIFIED, NO FORK, IPC', source: 'Note beat 3'}
  - {on_screen: '42 ms socket ready, 0.6 ms focus event, ~20 MiB, killed -> back in 7.5 ms; measured on luna-pi, a Raspberry Pi', source: 'Note beat 3; 0201_01_sway-ipc-proof.md, 0301_01_luna-pi-sway-result.md', machine: luna-pi}

