# Story 2, "Ask the desktop" (Wyoh), as a script. Times are seconds RELATIVE to the scene start; x / y are
# canvas pixels (1920 x 1080, margin 120). Format: common/README.md. Build: uv run python common/build.py <this file> --preview
episode: story2-ask-the-desktop
title: ASK THE DESKTOP
bpm: 120
stages: 7          # stage pips on the HUD and on the result screen
boss_stage: 5      # this stage number is the boss (red background, no pips)

# The episode's motif (Wyoh: E A B C, rising): [beat, midi, beats]; riffs are named note lists for events.
motif: [[0, 76, 1], [1, 81, 0.5], [1.5, 83, 0.5], [2, 84, 1.5], [3.5, 83, 0.5], [4, 81, 1], [5, 77, 1],
        [6, 79, 1], [7, 79, 0.5], [7.5, 76, 0.5], [8, 72, 1.5], [9.5, 74, 0.5], [10, 76, 2], [12, 74, 1], [13, 71, 1]]
riffs:
  boss: [[0, 64, 0.5], [0.5, 64, 0.5], [1, 65, 0.5], [1.5, 64, 0.5], [2, 62, 0.5], [2.5, 64, 1], [3.5, 59, 0.5]]

scenes:
- id: title
  template: T01
  bars: 3
  series: "TANSTAAFLLM · STORY 2"
  title: ASK THE DESKTOP
  title_at: 1.0
  sub: ["How an agent learned to work", "a desktop without looking at it."]
  mood: opener
  picture: 'Title: starfield, moon; series line, stamp, cyan subtitle, PRESS START'
  music_note: 'Coin, stamp, trailer theme over Am F G E'
  facts:
  - {on_screen: 'Episode title and subtitle', source: 'Note beat 1 (worklines/hazel/docs/0302_02_note-from-wyoh-story.md)'}

- id: player
  template: T04
  bars: 4
  face: wyoh
  label: "PLAYER 2"
  name: WYOH
  role: ["THE DESKTOP LAYER", "OF LUNA"]
  quest_label: "QUEST:"
  quest: ["Observe and operate", "the desktop without pixels."]
  mood: driving
  picture: "Player 2: Wyoh's key-art face, role, quest sentence"
  music_note: 'Groove Am F C G, the Wyoh motif'
  facts:
  - {on_screen: 'Quest: "Observe and operate the desktop without pixels."', source: 'Note beat 1; worklines/wyoh/docs/0000_04_desktop-automation-model.md'}

- id: stage1
  template: T05
  bars: 3
  stage: 1
  title: "THE SCREENSHOT TRAP"
  clear: 4.5
  mood: uneasy
  arp: 4
  content:
  - {kind: pixel_grid_guess, at: 0.4, agent_at: 0.6, guesses: [[1.0, "A BUTTON?"], [1.5, "A WINDOW?"], [2.0, "WHICH ONE?"]]}
  - {kind: text, font: V, size: 90, color: chrome, x: 120, y: 740, dy: 90, at: 0.9, fade: 0.2, read: true,
     lines: ["An agent guesses from pixels", "and pays for every image."]}
  - {kind: text, size: 40, color: cyan, x: 120, y: 945, at: 3.0, fade: 0.15, read: true, lines: ["ON PAPER: A DESKTOP DOM."]}
  events:
  - {fx: guess_coin, at: [1.0, 1.5, 2.0]}
  - {fx: nz, at: 0.9, v: [8, 5, 3], per: 2}
  - {fx: ding, at: 3.0, m: 81}
  - {fx: melody, at: 3.5, notes: [[0, 76, 1], [1, 75, 1], [2, 76, 1]], v: 8}
  picture: 'Stage 1: a drawn desktop pixelated into blocks, a squinting robot, three guesses each costing a coin; "ON PAPER: A DESKTOP DOM."'
  music_note: 'Am Dm E, coin + falling blip per guess, ding'
  facts:
  - {on_screen: '"An agent guesses from pixels and pays for every image."', source: 'Note beat 1 (no cost figure shown, as the brief asks)'}
  - {on_screen: '"ON PAPER: A DESKTOP DOM."', source: 'Note beat 1 (the DWOM idea); shown as a design only (must-not-say)'}

- id: stage2
  template: T05
  bars: 4
  stage: 2
  title: "ONE SCENE IS NOT A DESKTOP"
  clear: 6.5
  mood: wary
  arp: 4
  content:
  - {kind: scene_spill, label: HIOM, at: 0.4, gone_at: 2.5, spill_at: 1.6, spill_step: 0.15}
  - {kind: text, color: dim, x: 980, y: 330, at: 0.6, lines: ["FIRST IDEA: ONE SCENE"]}
  - {kind: text, color: dim, x: 980, y: 380, at: 2.8, lines: ["A DESKTOP DID NOT FIT."]}
  - {kind: stamp, size: 48, color: red, x: 980, y: 500, at: 2.5, rot: -0.05, lines: ["REOPENED"], read: true}
  - {kind: box, x: 140, y: 650, w: 1640, h: 230, edge: green, alpha: 0.95, at: 3.2, fade: 0.2}
  - {kind: text, color: amber, x: 190, y: 705, at: 3.2, lines: ["KEPT FROM IT:"]}
  - {kind: stamp, size: 56, color: green, x: 960, y: 785, dy: 70, at: 3.5, align: center, from: 1.4,
     lines: ["WAIT FOR A NAMED CONDITION,", "NEVER A FIXED DELAY."], read: "KEPT FROM IT: WAIT FOR A NAMED CONDITION, NEVER A FIXED DELAY."}
  events:
  - {fx: blip, ch: p2, at: 1.6, step: 0.15, n: 5, each: {m: [72, 75, 77, 79, 82]}, frames: 3, v: 8, duty: 1}
  - {fx: buzz, at: 2.5, dur: 0.4, m: 40}
  - {fx: tri_drop, at: 2.5, m0: 40, m1: 26, frames: 6}
  - {fx: groove, at: 4.0, mood: resolve}
  - {fx: stamp, at: 3.5, m1: 69, m2: 76, root: 33, v: 12}
  - {fx: melody, at: 4.0, notes: [[0, 76, 1], [1, 74, 0.5], [1.5, 72, 0.5], [2, 71, 1]], v: 9}
  picture: 'Stage 2, HIOM: one scene with A/B/X actions, windows spill out, "REOPENED"; kept lesson stamp'
  music_note: 'F G, rising blips, buzz + drop, stamp at 3.5'
  facts:
  - {on_screen: 'HIOM: first idea, one scene; a desktop did not fit; REOPENED', source: 'Note beat 2; 0101_01_hiom_v0_contract.md (status note 2026-09-25)'}
  - {on_screen: '"WAIT FOR A NAMED CONDITION, NEVER A FIXED DELAY."', source: 'Note beat 2 ("waits for a named predicate ... never a fixed delay")'}

- id: stage3
